name: Build recipes

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      recipes:
        description: Space- or comma-separated recipe names (defaults to zlib)
        required: false
        type: string
      publish:
        description: Publish built packages to the rolling channel
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.recipes.outputs.recipes }}
      count: ${{ steps.recipes.outputs.count }}
      changed: ${{ steps.recipes.outputs.changed }}
      changed_count: ${{ steps.recipes.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select recipes
        id: recipes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_RECIPES: ${{ inputs.recipes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $available = @(Get-ChildItem recipes -Directory | ForEach-Object Name)

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $requested = @($env:INPUT_RECIPES -split '[,\s]+' | Where-Object { $_ })
            if ($requested.Count -eq 0) { $requested = @('zlib') }
            $unknown = @($requested | Where-Object { $_ -notin $available })
            if ($unknown.Count) { throw "Unknown recipe: $($unknown -join ', ')" }
            $recipeChanges = @($requested | Sort-Object -Unique)
            $selected = $recipeChanges
          } else {
            $base = if ($env:EVENT_NAME -eq 'pull_request') {
              $env:BASE_SHA
            } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              $env:BEFORE_SHA
            } else {
              'HEAD^'
            }
            $changed = @(git diff --name-only $base $env:GITHUB_SHA)
            if ($LASTEXITCODE) { throw "git diff failed" }
            $recipeChanges = @(
              $changed |
                Where-Object { $_ -match '^recipes/([^/]+)/' } |
                ForEach-Object { $Matches[1] } |
                Sort-Object -Unique
            )
            $selected = $recipeChanges
            if ($changed -match '^(build\.cmd|tools/fetch\.ps1|\.github/workflows/build\.yml)$') {
              $selected = @($selected + 'zlib' | Sort-Object -Unique)
            }
          }

          # posix-env needs the new brush at test time. When both change,
          # build them on one runner so the local channel contains it.
          $buildBrushFirst = 'brush' -in $selected -and 'posix-env' -in $selected
          if ($buildBrushFirst) {
            $selected = @($selected | Where-Object { $_ -ne 'brush' })
          }
          $matrix = @($selected | ForEach-Object {
            @{
              recipe = $_
              build_brush_first = $buildBrushFirst -and $_ -eq 'posix-env'
            }
          })
          $json = ConvertTo-Json -InputObject $matrix -Compress
          $changedJson = ConvertTo-Json -InputObject @($recipeChanges) -Compress
          "recipes=$json" >> $env:GITHUB_OUTPUT
          "count=$($selected.Count)" >> $env:GITHUB_OUTPUT
          "changed=$changedJson" >> $env:GITHUB_OUTPUT
          "changed_count=$($recipeChanges.Count)" >> $env:GITHUB_OUTPUT
          if ($selected.Count) {
            "Building: $($selected -join ', ')"
          } else {
            'No recipes changed.'
          }

  build:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install external UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Locate external toolchain
        shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolchain = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $compiler = Join-Path $toolchain 'gcc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "UCRT64 compiler not found at $compiler"
          }
          "POSIX_ENV_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          & $compiler --version

      - name: Download pinned build tools
        shell: powershell
        run: tools\fetch.ps1

      - name: Build brush before posix-env
        if: matrix.build_brush_first
        shell: cmd
        env:
          POSIX_ENV_BOOTSTRAP_CHANNEL: https://oltolm.github.io/posix-env/channel
        run: build.cmd brush

      - name: Build ${{ matrix.recipe }}
        shell: cmd
        env:
          POSIX_ENV_BOOTSTRAP_CHANNEL: https://oltolm.github.io/posix-env/channel
        run: build.cmd ${{ matrix.recipe }}

      - name: Check package output
        shell: powershell
        run: |
          $packages = @(Get-ChildItem output\win-64\*.conda)
          if ($packages.Count -eq 0) { throw 'The build produced no packages.' }
          $packages | ForEach-Object Name

      - name: Upload packages
        if: contains(fromJSON(needs.select.outputs.changed), matrix.recipe)
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.recipe }}-${{ github.sha }}
          path: |
            output/win-64/*.conda
            output/win-64/repodata.json
            output/noarch/*.conda
            output/noarch/repodata.json
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: [select, build]
    if: needs.select.outputs.changed_count != '0'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Download pinned build tools
        shell: powershell
        run: tools\fetch.ps1

      - name: Download built packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/incoming

      - name: Smoke-test installer and launcher setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'posix-env-installer-smoke'
          $marker = "$prefix.posix-env-installing"
          try {
            tools\install.ps1 -InstallDir $prefix -MicromambaPath tools\micromamba.exe
            & "$prefix\posix-env.cmd" list
            if ($LASTEXITCODE) { throw "posix-env list failed with exit code $LASTEXITCODE" }

            # Install this run's packages together, including new packages
            # that the published channel cannot provide yet. Keep each
            # artifact's index beside its packages; do not overwrite indexes
            # by merging artifact directories.
            $channels = @()
            $specs = @()
            Get-ChildItem "$env:RUNNER_TEMP\incoming" -Directory | ForEach-Object {
              $channels += @('-c', ([Uri]($_.FullName + '\')).AbsoluteUri)
              Get-ChildItem $_.FullName -Filter repodata.json -Recurse | ForEach-Object {
                $index = Get-Content $_.FullName -Raw | ConvertFrom-Json
                foreach ($entry in $index.'packages.conda'.PSObject.Properties) {
                  if (Test-Path (Join-Path $_.DirectoryName $entry.Name)) {
                    $record = $entry.Value
                    $specs += "$($record.name)=$($record.version)=$($record.build)"
                  }
                }
              }
            }
            if (-not $specs.Count) { throw 'No candidate packages found.' }
            & tools\micromamba.exe --no-rc install -y -p $prefix --override-channels @channels `
              -c https://oltolm.github.io/posix-env/channel @specs
            if ($LASTEXITCODE) { throw "Candidate installation failed with exit code $LASTEXITCODE" }

            # Test the installed launcher with its new default packages
            # already available, before any artifacts are published.
            & "$prefix\posix-env.cmd" setup
            if ($LASTEXITCODE) { throw "posix-env setup failed with exit code $LASTEXITCODE" }
          } finally {
            $integration = Join-Path $prefix 'share\posix-env\posix-env-entries.ps1'
            if (Test-Path $integration) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $integration -Remove
            }
            if (Test-Path $prefix) { Remove-Item -LiteralPath $prefix -Recurse -Force }
            if (Test-Path $marker) { Remove-Item -LiteralPath $marker -Force }
          }

  publish:
    needs: [select, build, smoke]
    if: >-
      needs.select.outputs.changed_count != '0' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: windows-2025
    concurrency:
      group: rolling-channel
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download built packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/incoming

      - name: Publish rolling channel update
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools\release.ps1 -Publish
          -InputRoot "$env:RUNNER_TEMP\incoming"
