name: Build recipes

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      recipes:
        description: Space- or comma-separated recipe names (defaults to zlib)
        required: false
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.recipes.outputs.recipes }}
      count: ${{ steps.recipes.outputs.count }}
      changed: ${{ steps.recipes.outputs.changed }}
      changed_count: ${{ steps.recipes.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select recipes
        id: recipes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_RECIPES: ${{ inputs.recipes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $available = @(Get-ChildItem recipes -Directory | ForEach-Object Name)

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $requested = @($env:INPUT_RECIPES -split '[,\s]+' | Where-Object { $_ })
            if ($requested.Count -eq 0) { $requested = @('zlib') }
            $unknown = @($requested | Where-Object { $_ -notin $available })
            if ($unknown.Count) { throw "Unknown recipe: $($unknown -join ', ')" }
            $recipeChanges = @($requested | Sort-Object -Unique)
            $selected = $recipeChanges
          } else {
            $base = if ($env:EVENT_NAME -eq 'pull_request') {
              $env:BASE_SHA
            } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              $env:BEFORE_SHA
            } else {
              'HEAD^'
            }
            $changed = @(git diff --name-only $base $env:GITHUB_SHA)
            if ($LASTEXITCODE) { throw "git diff failed" }
            $recipeChanges = @(
              $changed |
                Where-Object { $_ -match '^recipes/([^/]+)/' } |
                ForEach-Object { $Matches[1] } |
                Sort-Object -Unique
            )
            $selected = $recipeChanges
            if ($changed -match '^(build\.cmd|tools/fetch\.ps1|\.github/workflows/build\.yml)$') {
              $selected = @($selected + 'zlib' | Sort-Object -Unique)
            }
          }

          $json = ConvertTo-Json -InputObject @($selected) -Compress
          $changedJson = ConvertTo-Json -InputObject @($recipeChanges) -Compress
          "recipes=$json" >> $env:GITHUB_OUTPUT
          "count=$($selected.Count)" >> $env:GITHUB_OUTPUT
          "changed=$changedJson" >> $env:GITHUB_OUTPUT
          "changed_count=$($recipeChanges.Count)" >> $env:GITHUB_OUTPUT
          if ($selected.Count) {
            "Building: $($selected -join ', ')"
          } else {
            'No recipes changed.'
          }

  build:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.select.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install external UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Locate external toolchain
        shell: powershell
        run: |
          $compiler = (Get-Command gcc.exe -ErrorAction Stop).Source
          "POSIX_ENV_TOOLCHAIN=$(Split-Path $compiler)" >> $env:GITHUB_ENV
          & $compiler --version

      - name: Download pinned build tools
        shell: powershell
        run: tools\fetch.ps1

      - name: Build ${{ matrix.recipe }}
        shell: cmd
        env:
          POSIX_ENV_BOOTSTRAP_CHANNEL: https://oltolm.github.io/posix-env/channel
        run: build.cmd ${{ matrix.recipe }}

      - name: Check package output
        shell: powershell
        run: |
          $packages = @(Get-ChildItem output\win-64\*.conda)
          if ($packages.Count -eq 0) { throw 'The build produced no packages.' }
          $packages | ForEach-Object Name

      - name: Upload packages
        if: contains(fromJSON(needs.select.outputs.changed), matrix.recipe)
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.recipe }}-${{ github.sha }}
          path: |
            output/win-64/*.conda
            output/win-64/repodata.json
            output/noarch/*.conda
            output/noarch/repodata.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [select, build]
    if: github.event_name == 'push' && needs.select.outputs.changed_count != '0'
    runs-on: windows-2025
    concurrency:
      group: rolling-channel
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download built packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/incoming

      - name: Publish rolling channel update
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools\release.ps1 -Publish
          -InputRoot "$env:RUNNER_TEMP\incoming"
