# Retained patches numbered 0001-0018 originated in
# MSYS2's mingw-w64-brush patch series. Libtool/gettext source fixes formerly
# supplied by patches 0015, 0021, 0026, and 0027 live in posix-env-prepare.
# 0.5.0 includes the fixes from 0007, 0014, and 0017. Patch 0025 now retains
# only its regression test: upstream resolves executable extensions itself.
context:
  version: 0.5.0

package:
  name: brush
  version: ${{ version }}

source:
  - url: https://github.com/reubeno/brush/archive/refs/tags/brush-shell-v${{ version }}.tar.gz
    sha256: c55a57d399112d5509b17518e756acb613886702bccfe9243ba2020a664fc066
    patches:
      - 0001-fix-windows-don-t-refuse-to-spawn-commands-while-fds.patch
      - 0002-feat-windows-enable-the-exec-builtin.patch
      - 0003-fix-windows-use-forward-slashes-in-PWD-OLDPWD-and-pw.patch
      - 0004-feat-windows-run-scripts-through-their-interpreter.patch
      - 0005-fix-windows-treat-directories-as-executable-in-test-.patch
      - 0006-feat-windows-accept-POSIX-signal-names-and-numbers-i.patch
      - 0008-fix-don-t-deadlock-on-here-docs-larger-than-the-pipe.patch
      - 0009-feat-windows-add-the-umask-builtin.patch
      - 0010-fix-windows-convert-CRLF-to-LF-in-command-substituti.patch
      - 0011-fix-parser-remove-backslashes-inside-backquotes-as-P.patch
      - 0012-fix-windows-join-PATH-entries-and-command-names-with.patch
      - 0013-fix-windows-quote-wildcard-arguments-passed-to-nativ.patch
      - 0016-feat-windows-implement-test-ef.patch
      - 0018-fix-windows-resolve-a-relative-program-path-against-.patch
      - 0019-fix-windows-spell-the-spawned-program-path-with-back.patch
      - 0020-fix-ignore-break-and-continue-outside-a-loop-as-bash.patch
      - 0022-fix-keep-command-substitution-output-that-is-not-UTF.patch
      - 0023-fix-parser-don-t-take-esac-for-a-case-pattern.patch
      - 0024-fix-tokenizer-follow-case-commands-in-command-substi.patch
      - 0025-fix-windows-start-a-program-by-its-file-name-extensi.patch
      - 0028-fix-windows-run-ENOEXEC-files-as-shell-scripts.patch
      - 0029-feat-windows-resolve-POSIX-bin-paths-through-PATH.patch
      - 0030-feat-windows-report-CPU-time-in-time-and-times.patch
      - 0031-fix-measure-the-real-time-of-time-with-a-monotonic-c.patch
      - 0032-feat-windows-rm-and-cat-builtins.patch
      - 0033-fix-windows-reserve-an-8-MiB-main-thread-stack.patch
      - 0034-feat-source-BASH_ENV-in-non-interactive-shells.patch
  - url: https://github.com/reubeno/brush/releases/download/brush-shell-v${{ version }}/brush-docs.tar.gz
    sha256: 4ee772d5842be84c99f2a2ca5aac905bc2d6a7b7229955371129f4f7e19eb677
    target_directory: docs

build:
  number: 0
  script:
    interpreter: brush
    file: build.sh

requirements:
  build:
    - posix-env

tests:
  # The post-link script has run: sh and bash exist.
  - script:
      interpreter: cmd
      content:
        - brush --version
        - sh -c "test $((6 * 7)) = 42" || exit /b 1
        - bash -c "f() { echo ok; }; f" | findstr /b ok || exit /b 1
        # esac and a subshell's ")" on one line (patch 0023).
        - sh -c "(case x in x) echo ok;; esac)" | findstr /b ok || exit /b 1
        # A case pattern's ")" in a command substitution (patch 0024).
        - sh -c "echo $(case x in x) echo ok;; esac)" | findstr /b ok || exit /b 1
        # A file without #! is interpreted by brush after ERROR_BAD_EXE_FORMAT (patch 0028).
        - 'echo echo fallback-ok> no-shebang'
        - sh -c "./no-shebang" | findstr /x fallback-ok || exit /b 1
        - sh -c "exec /bin/sh -c 'exit 0'" || exit /b 1
        - sh -c "exec /usr/bin/sh -c 'exit 0'" || exit /b 1
        # Children's CPU time is counted (patch 0030).
        - sh -c "\"$BASH\" -c 'i=0; while [ $i -lt 100000 ]; do i=$((i+1)); done'; set -- $(times); test \"$3\" != 0m0.000s" || exit /b 1
        # rm and cat are builtins; enable -n leaves them to PATH (patch 0032).
        - sh -c "test \"$(type -t rm cat)\" = \"$(printf 'builtin\nbuiltin')\"" || exit /b 1
        - sh -c "printf 'here\n' > f && cat f - < f > g && rm -f f missing && test ! -e f && test \"$(cat g)\" = \"$(printf 'here\nhere')\"" || exit /b 1
        - sh -c "enable -n rm cat; case $(type -t rm cat) in *builtin*) exit 1;; esac" || exit /b 1
        # A non-interactive shell sources $BASH_ENV, also as sh: brush takes no
        # mode from its name.  Posix mode reads no startup file (patch 0034).
        - sh -c "printf 'x=set\n' > envfile"
        - set "BASH_ENV=%CD%\envfile"
        - bash -c "test \"$x\" = set" || exit /b 1
        - sh -c "test \"$x\" = set" || exit /b 1
        - bash --posix -c "test -z \"$x\"" || exit /b 1
        - set "BASH_ENV="

about:
  homepage: https://github.com/reubeno/brush
  license: MIT
  license_file: LICENSE
  summary: Bash-compatible shell written in Rust, with fixes for native Windows
