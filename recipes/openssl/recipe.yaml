context:
  version: "4.1.0"

package:
  name: openssl
  version: ${{ version }}

source:
  url: https://github.com/openssl/openssl/releases/download/openssl-${{ version }}/openssl-${{ version }}.tar.gz
  sha256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
  patches:
    # OPENSSLDIR and MODULESDIR follow the installation.
    - 0001-relocation.patch
    - 0002-arch-suffix.patch

build:
  number: 0
  script:
    interpreter: brush
    file: build.sh

requirements:
  run_exports:
    - ${{ pin_subpackage('openssl', upper_bound='x') }}
  build:
    - posix-env
  host:
    - zlib

tests:
  - script:
      interpreter: cmd
      content:
        - openssl version -a
        # The runtime directories were relocated: neither names the build prefix.
        - openssl info -configdir | findstr /c:"h_env" && exit /b 1 || ver > NUL
        - openssl info -modulesdir | findstr /c:"h_env" && exit /b 1 || ver > NUL
        # Loading the legacy provider needs the relocated MODULESDIR.
        - openssl list -providers -provider legacy | findstr /c:"legacy" || exit /b 1
        - echo abc | openssl dgst -sha256 || exit /b 1
  - package_contents:
      files:
        - bin/libcrypto-4-x64.dll
        - bin/libssl-4-x64.dll
        - lib/libcrypto.dll.a
        - lib/pkgconfig/openssl.pc
        - include/openssl/ssl.h

about:
  homepage: https://www.openssl.org/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: TLS/SSL and crypto library
