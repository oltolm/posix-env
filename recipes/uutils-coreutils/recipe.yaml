context:
  version: "0.12.0"

package:
  name: uutils-coreutils
  version: ${{ version }}

source:
  url: https://github.com/uutils/coreutils/archive/${{ version }}/coreutils-${{ version }}.tar.gz
  sha256: 4fb327655cb4ffcbf2f16550cf9234079ffe839692f7aa1a6eda104af684e122
  patches:
    # Relative symlink targets with '/' never resolve on Windows.
    - 0001-ln-store-symlink-targets-with-backslashes-on-Windows.patch
    # dd conv=lcase/ucase took the Windows locale and mapped UTF-8 lead bytes.
    - 0002-dd-no-setlocale-for-conv-lcase-ucase-on-Windows.patch
    # env could not start #! scripts (libtool runs its helpers through env).
    - 0003-env-run-scripts-through-their-interpreter-on-Windows.patch
    # mktemp printed "./confXXXXXX" as ".\conf...", which autoconf 2.59's
    # config.status lost in eval.
    - 0004-mktemp-print-the-name-as-the-template-gives-it-on-Wi.patch
    # ln -s ../../ld-new tmpdir/ld/ld linked to nothing: as Cygwin does, a
    # link to program NAME is a link to NAME.exe, named LINK.exe.
    - 0005-ln-link-programs-by-their-.exe-name-on-Windows.patch
    # pwd, realpath and readlink printed C:\src\...: gcc's $(shell pwd)
    # went into a Tcl file, where \s and \b are escapes.
    - 0006-pwd-realpath-readlink-print-paths-with-on-Windows.patch
    # ls -i needs the 64-bit file index from GetFileInformationByHandle.
    - 0007-ls-print-Windows-file-index-for-inode.patch

build:
  number: 11
  script:
    interpreter: brush
    file: build.sh

requirements:
  build:
    - posix-env

tests:
  # The post-link script has run: the utilities exist under their own names.
  - requirements:
      run:
        - brush
    script:
      interpreter: cmd
      content:
        - coreutils --version
        - ls --version
        - echo hello | tr h H | findstr /b Hello || exit /b 1
        - if not exist "%PREFIX%\bin\[.exe" exit /b 1
        # dd maps ASCII only: the UTF-8 bytes of É stay (patch 0002).
        - printf \303\211A\n | dd conv=lcase status=none | od -An -tx1 | findstr /c:"c3 89 61 0a" || exit /b 1
        # env runs #! scripts through their interpreter, by path or found in
        # PATH (patch 0003).
        - 'echo #!/usr/bin/env coreutils echo> script'
        - env ./script a | findstr /b /c:"./script a" || exit /b 1
        - set "PATH=%CD%;%PATH%"
        - env script b | findstr /c:"/script b" || exit /b 1
        # mktemp prints the name as the template gives it (patch 0004).
        - mktemp -u ./confXXXXXX | findstr /b /c:"./conf" || exit /b 1
        # ln links program NAME as NAME.exe (patch 0005).
        - sh -c "cp \"$(command -v sh)\" prog.exe && mkdir d && ln -s ../prog d/ld && test -L d/ld.exe && d/ld.exe -c true" || exit /b 1
        # pwd and realpath print / as the shell's pwd does (patch 0006).
        - sh -c "test \"$(env pwd)\" = \"$(pwd)\" && test \"$(realpath .)\" = \"$(pwd)\"" || exit /b 1
        # ls -i prints a nonzero file index, shared by hard links (patch 0007).
        - sh -c "echo x > inode-a && ln inode-a inode-b && set -- $(ls -i inode-a inode-b) && test \"$1\" -gt 0 && test \"$1\" = \"$3\"" || exit /b 1
        # Utilities that call the delay-loaded DLLs (build.sh): version,
        # wtsapi32, ws2_32, advapi32, mpr, bcrypt.
        - uname -a | findstr /b Windows_NT || exit /b 1
        - uptime | findstr /c:" up " || exit /b 1
        - hostname || exit /b 1
        - whoami || exit /b 1
        - df . || exit /b 1
        - shuf -i 1-3 -n 1 || exit /b 1

about:
  homepage: https://github.com/uutils/coreutils
  license: MIT
  license_file: LICENSE
  summary: Cross-platform Rust rewrite of the GNU coreutils, one multicall binary
