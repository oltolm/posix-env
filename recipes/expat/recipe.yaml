context:
  version: "2.10.0"

package:
  name: expat
  version: ${{ version }}

source:
  url: https://github.com/libexpat/libexpat/releases/download/R_${{ version | replace('.', '_') }}/expat-${{ version }}.tar.xz
  sha256: c624ba2998fc65df1163a49641ff3f9ab73138b11641d92c86bee0fb01b1bc7f

build:
  number: 0
  script:
    interpreter: brush
    content:
      # The release's configure; MSYS2 uses CMake.  libgcc is linked
      # statically: the toolchain's DLLs are not part of any environment.
      - >-
        ./configure --prefix="$PREFIX" --enable-shared --disable-static
        --without-examples --without-tests --without-docbook
        CC="gcc -static-libgcc" lt_cv_deplibs_check_method=pass_all
      - make -j"$(nproc)"
      - make install

requirements:
  run_exports:
    - ${{ pin_subpackage('expat', upper_bound='x') }}
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - echo ^<a^>^<b/^>^</a^>> t.xml
        - xmlwf t.xml || exit /b 1
  - package_contents:
      files:
        - bin/libexpat-1.dll
        - lib/libexpat.dll.a
        - lib/pkgconfig/expat.pc
        - include/expat.h

about:
  homepage: https://libexpat.github.io/
  license: MIT
  license_file: COPYING
  summary: Stream-oriented XML parser library
