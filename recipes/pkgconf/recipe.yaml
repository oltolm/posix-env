context:
  version: "3.0.11"

package:
  name: pkgconf
  version: ${{ version }}

source:
  url: https://distfiles.ariadne.space/pkgconf/pkgconf-${{ version }}.tar.xz
  sha256: d0cd841bc8e55b9da888106c00dc256d05b7d1d8e5a46f4be4eb4c5125bd2dc4

build:
  number: 0
  script:
    interpreter: brush
    content:
      - ./configure --prefix="$PREFIX" --disable-static
      - make -j"$(nproc)"
      - make install
      - cp "$PREFIX/bin/pkgconf.exe" "$PREFIX/bin/pkg-config.exe"

requirements:
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - pkgconf --version
        - pkg-config --version
        - pkg-config --exists libpkgconf || exit /b 1

about:
  homepage: http://pkgconf.org/
  license: ISC
  license_file: COPYING
  summary: Package compiler and linker metadata toolkit
