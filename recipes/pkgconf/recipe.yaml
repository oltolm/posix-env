context:
  version: "3.0.10"

package:
  name: pkgconf
  version: ${{ version }}

source:
  url: https://distfiles.ariadne.space/pkgconf/pkgconf-${{ version }}.tar.xz
  sha256: 9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de

build:
  number: 0
  script:
    interpreter: brush
    content:
      - ./configure --prefix="$PREFIX" --disable-static
      - make -j"$(nproc)"
      - make install
      - cp "$PREFIX/bin/pkgconf.exe" "$PREFIX/bin/pkg-config.exe"

requirements:
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - pkgconf --version
        - pkg-config --version
        - pkg-config --exists libpkgconf || exit /b 1

about:
  homepage: http://pkgconf.org/
  license: ISC
  license_file: COPYING
  summary: Package compiler and linker metadata toolkit
