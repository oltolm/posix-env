# Seeds the channel with the tools of an existing posix-env installation, so
# that the first real recipes can run build.sh under brush.  The real
# posix-env package (a higher version) and the tool packages replace it.
context:
  # Backslashes: cmd's copy and xcopy reject forward slashes in paths.
  seed: C:\msys64\ucrt64\lib\posix-env\bin
  dlls: C:\msys64\ucrt64\bin

package:
  name: posix-env
  version: 0.0.0

build:
  number: 1
  string: bootstrap_1
  script:
    interpreter: cmd
    content:
      - mkdir "%PREFIX%\bin" "%PREFIX%\share\posix-env" "%PREFIX%\etc\conda\activate.d" "%PREFIX%\etc\conda\deactivate.d"
      # Tools only; the Autotools wrappers refer to the MSYS2 installation.
      - for %%f in ("${{ seed }}\*.exe") do @echo %%~nf | findstr /r /b /c:"auto" /c:"aclocal" /c:"ifnames" /c:"code" /c:"less" >nul || copy /b "%%f" "%PREFIX%\bin\" >nul
      - copy /b "${{ seed }}\sh.exe" "%PREFIX%\bin\brush.exe"
      - for %%d in (libcrypto-3-x64 libssl-3-x64 libonig-5 libgmp-10 libiconv-2 libintl-8 libmpfr-6 libreadline8 libtermcap-0 libwinpthread-1 libgcc_s_seh-1) do @if exist "${{ dlls }}\%%d.dll" copy /b "${{ dlls }}\%%d.dll" "%PREFIX%\bin\" >nul
      - copy "%RECIPE_DIR%\config.site" "%PREFIX%\share\posix-env\"
      - copy "%RECIPE_DIR%\activate.bat" "%PREFIX%\etc\conda\activate.d\posix-env.bat"
      - copy "%RECIPE_DIR%\deactivate.bat" "%PREFIX%\etc\conda\deactivate.d\posix-env.bat"

about:
  summary: Bootstrap copy of an existing native POSIX environment
