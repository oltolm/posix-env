# micromamba, the upstream release binary: the launcher installed in the
# environment manages its packages with it.
context:
  version: "2.10.0"

package:
  name: micromamba
  version: ${{ version }}

source:
  url: https://github.com/mamba-org/micromamba-releases/releases/download/${{ version }}-0/micromamba-win-64.exe
  sha256: f8b4284bd4eb1134122eaf93b3ea6c7be567e596de5829e1a6f478e34e41974a
  file_name: micromamba.exe

build:
  number: 0
  script:
    interpreter: brush
    content:
      # Not in bin: package commands go through the launcher, which pins the
      # environment's channel.
      - mkdir -p "$PREFIX/libexec/posix-env"
      - cp micromamba.exe "$PREFIX/libexec/posix-env/"

requirements:
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - '"%PREFIX%\libexec\posix-env\micromamba.exe" --version || exit /b 1'

about:
  homepage: https://github.com/mamba-org/mamba
  license: BSD-3-Clause
  summary: Package manager for conda packages, used by the posix-env launcher
