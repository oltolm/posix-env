context:
  version: "1.19"

package:
  name: libiconv
  version: ${{ version }}

source:
  url: https://ftpmirror.gnu.org/gnu/libiconv/libiconv-${{ version }}.tar.gz
  sha256: 88dd96a8c0464eca144fc791ae60cd31cd8ee78321e67397e25fc095c4a19aa6
  patches:
    - 0001-cast-pointers-to-intptr_t.patch
    - 0002-add-cp65001-as-utf8-alias.patch

build:
  number: 5
  script:
    interpreter: brush
    content:
      # The alias tables are generated from encodings.def, which 0002 changes.
      - >-
        make -f Makefile.devel CC=gcc
        lib/aliases.h lib/aliases_sysaix.h lib/aliases_syshpux.h lib/aliases_sysosf1.h
        lib/aliases_syssolaris.h lib/aliases_sysos2.h lib/aliases_aix.h lib/aliases_aix_sysaix.h
        lib/aliases_osf1.h lib/aliases_osf1_sysosf1.h lib/aliases_dos.h lib/aliases_os2.h
        lib/aliases_os2_sysos2.h lib/aliases_zos.h lib/aliases_extra.h
      # No NLS: gettext-runtime needs libiconv, and with it in host: the
      # libiconv files already there would be left out of this package.  NLS
      # would only translate the iconv program's messages.
      - ./configure --prefix="$PREFIX" --enable-extra-encodings --enable-shared --disable-static --disable-rpath --disable-nls
      - make -j"$(nproc)"
      - make install

requirements:
  run_exports:
    - ${{ pin_subpackage('libiconv', upper_bound='x') }}
  build:
    - posix-env
    - gperf

tests:
  - script:
      interpreter: cmd
      content:
        - iconv --version
        - echo abc | iconv -f CP65001 -t UTF-16LE > NUL || exit /b 1
  - package_contents:
      files:
        - bin/libiconv-2.dll
        - lib/libiconv.dll.a
        - include/iconv.h

about:
  homepage: https://www.gnu.org/software/libiconv/
  license: LGPL-2.1-or-later AND GPL-3.0-or-later
  license_file:
    - COPYING.LIB
    - COPYING
  summary: Character set conversion library and the iconv program
