context:
  version: "3.8.9"

package:
  name: libarchive
  version: ${{ version }}

source:
  url: https://github.com/libarchive/libarchive/releases/download/v${{ version }}/libarchive-${{ version }}.tar.xz
  sha256: 888c934f9d95648ecb9163dc8e23ab80a476ecb81a8f1154704a227b5b676dde
  patches:
    # Upstream merges after 3.8.9 for bsdunzip as unzip, as in MSYS2's
    # mingw-w64-libarchive.
    - 0001-unzip-Set-O_BINARY-on-Windows-systems-9aa710d.patch
    - 0002-bsdunzip-Support-Z-1-as-well-9c9cb93.patch
    - 0003-unzip-Look-up-alternative-filenames-as-well-ddf8247.patch
    # Not yet submitted upstream.
    - 0004-libarchive-Use-multithreaded-decoder-for-xz-e048b3b8.patch
    - 0005-tar-Handle-unconvertible-pathnames-in-edit_pathname.patch
    - 0006-tar-Use-UTF-8-as-Windows-active-code-page.patch
    - 0007-configure-Quote-PLATFORMCPPFLAGS-for-MinGW.patch
    - 0008-configure-Build-bsdunzip-on-Windows-as-well.patch
    - 0009-unzip-Use-UTF-8-as-Windows-active-code-page.patch

build:
  number: 4
  script:
    interpreter: brush
    file: build.sh

requirements:
  run_exports:
    - ${{ pin_subpackage('libarchive', upper_bound='x.x') }}
  build:
    - posix-env
    - autoconf
    - automake
    - libtool
    - pkgconf
  host:
    - zlib
    - bzip2
    - xz
    - lz4
    - zstd
    - libb2
    - libiconv
    - expat
    - pcre2

tests:
  - script:
      interpreter: cmd
      content:
        - bsdtar --version
        - tar --version | findstr /c:"liblzma" || exit /b 1
        - tar --version | findstr /c:"libzstd" || exit /b 1
        - mkdir d && echo hello> d\f
        - tar -cJf t.tar.xz d || exit /b 1
        # As autopoint uses it: the archive on stdin, compression detected.
        - mkdir x && tar -xf - -C x d/f < t.tar.xz || exit /b 1
        - findstr /b hello x\d\f || exit /b 1
        - tar -cf t.zip --format zip d || exit /b 1
        - unzip -p t.zip d/f | findstr /b hello || exit /b 1
        - echo hello | bsdcat | findstr /b hello || exit /b 1
  - package_contents:
      files:
        - bin/libarchive-13.dll
        - lib/libarchive.dll.a
        - lib/pkgconfig/libarchive.pc
        - include/archive.h
        - include/archive_entry.h

about:
  homepage: https://www.libarchive.org/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Multi-format archive and compression library, bsdtar and bsdunzip
