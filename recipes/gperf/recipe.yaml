context:
  version: "3.3"

package:
  name: gperf
  version: ${{ version }}

source:
  url: https://ftpmirror.gnu.org/gnu/gperf/gperf-${{ version }}.tar.gz
  sha256: fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8

build:
  number: 5
  script:
    interpreter: brush
    content:
      # gperf is C++.  It is linked statically, runtime and winpthread
      # included: the toolchain's DLLs are not part of any environment, and
      # gperf.exe uses no other DLL.
      - ./configure --prefix="$PREFIX" CXX="g++ -static"
      - make -j"$(nproc)"
      - make install

requirements:
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - gperf --version

about:
  homepage: https://www.gnu.org/software/gperf/
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: Perfect hash function generator
