context:
  version: "1.4"

package:
  name: zlib
  version: ${{ version }}

source:
  url: https://github.com/madler/zlib/releases/download/v${{ version }}/zlib-${{ version }}.tar.xz
  sha256: 4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c

build:
  number: 0
  script:
    interpreter: brush
    content:
      # zlib's own MinGW makefile; MSYS2 patches configure instead.  minizip,
      # which MSYS2 builds in the same package, is not part of this one.
      # Only the libraries: install needs no more, and the example programs
      # failed to link intermittently in parallel builds.
      - make -j"$(nproc)" -f win32/Makefile.gcc SHARED_MODE=1 LDFLAGS=-static-libgcc libz.a zlib1.dll
      - >-
        make -f win32/Makefile.gcc SHARED_MODE=1 install
        BINARY_PATH="$PREFIX/bin" INCLUDE_PATH="$PREFIX/include" LIBRARY_PATH="$PREFIX/lib"
      # Shared only, like the other libraries.
      - rm "$PREFIX/lib/libz.a"

requirements:
  run_exports:
    - ${{ pin_subpackage('zlib', upper_bound='x.x') }}
  build:
    - posix-env

tests:
  - package_contents:
      files:
        - bin/zlib1.dll
        - lib/libz.dll.a
        - lib/pkgconfig/zlib.pc
        - include/zlib.h
        - include/zconf.h

about:
  homepage: https://zlib.net/
  license: Zlib
  license_file: LICENSE
  summary: Compression library implementing deflate
