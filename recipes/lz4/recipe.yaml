context:
  version: "1.10.0"

package:
  name: lz4
  version: ${{ version }}

source:
  url: https://github.com/lz4/lz4/releases/download/v${{ version }}/lz4-${{ version }}.tar.gz
  sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b

build:
  number: 3
  script:
    interpreter: brush
    file: build.sh

requirements:
  run_exports:
    - ${{ pin_subpackage('lz4', upper_bound='x') }}
  build:
    - posix-env

tests:
  - script:
      interpreter: cmd
      content:
        - lz4 --version
        - echo hello> t
        - lz4 t t.lz4 || exit /b 1
        - lz4cat t.lz4 | findstr /b hello || exit /b 1
  - package_contents:
      files:
        - bin/liblz4.dll
        - lib/liblz4.dll.a
        - lib/pkgconfig/liblz4.pc
        - include/lz4.h
        - include/lz4frame.h

about:
  homepage: https://lz4.org/
  license: BSD-2-Clause AND GPL-2.0-or-later
  license_file:
    - lib/LICENSE
    - programs/COPYING
  summary: Extremely fast compression library and lz4 program
